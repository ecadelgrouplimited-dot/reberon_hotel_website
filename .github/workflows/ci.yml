name: CI

on:
  push: { branches: [main] }
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: reberon, POSTGRES_PASSWORD: reberon, POSTGRES_DB: reberon }
        ports: ["5433:5432"]
        options: --health-cmd "pg_isready -U reberon" --health-interval 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 3s --health-retries 30
      mailpit:
        image: axllent/mailpit:latest
        ports: ["1025:1025", "8025:8025"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }

      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Environment
        run: cp .env.example .env

      - name: Build packages and the API
        run: pnpm turbo run build --filter=@reberon/api...
      - name: Migrate and seed (demo data)
        run: |
          pnpm --filter @reberon/db migrate:deploy
          pnpm db:seed

      - name: Start the API
        run: |
          nohup node apps/api/dist/main.js > api.log 2>&1 &
          for i in $(seq 1 60); do curl -fs http://localhost:4000/v1/health && break; sleep 2; done

      - name: Build the website and the House
        run: pnpm turbo run build --filter=@reberon/web --filter=@reberon/admin
      - name: Typecheck and lint
        run: pnpm turbo run typecheck lint
      - name: API tests
        run: pnpm --filter @reberon/api test

      - name: API log
        if: failure()
        run: tail -n 200 api.log

  docker:
    # Proves the production images build; they are pushed nowhere yet.
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: API image
        uses: docker/build-push-action@v6
        with: { context: ., file: infra/docker/api.Dockerfile, push: false, cache-from: type=gha, cache-to: "type=gha,mode=max" }
      - name: House image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/next.Dockerfile
          push: false
          build-args: |
            APP=admin
            API_URL=http://api:4000
            WEB_URL=https://reberonhotel.ug
            ADMIN_URL=https://house.reberonhotel.ug
            MEDIA_PUBLIC_URL=https://api.reberonhotel.ug/media
            NEXT_PUBLIC_API_URL=https://api.reberonhotel.ug
            NEXT_PUBLIC_WEB_URL=https://reberonhotel.ug
          cache-from: type=gha
          cache-to: "type=gha,mode=max"
